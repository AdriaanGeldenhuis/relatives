name: Deploy Relatives

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relatives-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: release-fixture
          MARIADB_DATABASE: relatives_release_ci
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check PHP, JavaScript and Wake
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l >/dev/null
          git ls-files -z '*.js' '*.cjs' | xargs -0 -r -n1 node --check
          node --test tracking/tests/wake-ui.test.cjs
          composer install --no-dev --no-interaction --prefer-dist --no-scripts --optimize-autoloader
      - name: Check authenticated chat, reminders and tracking
        shell: bash
        env:
          FIXTURE_DB_CONTAINER: ${{ job.services.database.id }}
          RELATIVES_TRACKING_TEST_DSN: mysql:host=127.0.0.1;port=3307;dbname=relatives_tracking_test;charset=utf8mb4
          RELATIVES_TRACKING_TEST_USER: root
          RELATIVES_TRACKING_TEST_PASSWORD: release-fixture
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=release-fixture "$FIXTURE_DB_CONTAINER" mariadb -uroot \
            -e 'CREATE DATABASE relatives_tracking_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php tracking/tests/reliability.php
          bash tests/reliability-smoke.sh "$FIXTURE_DB_CONTAINER"
      - name: Deploy website and Android sources over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PHP: ${{ vars.DEPLOY_PHP }}
        run: |
          set -euo pipefail
          for name in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS DEPLOY_PATH; do
            if [[ -z ${!name:-} ]]; then
              printf '::error::Missing repository Actions secret %s\n' "$name"
              exit 1
            fi
          done
          if [[ ! $SSH_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ ||
                ! $SSH_USER =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ||
                ! $SSH_PORT =~ ^[0-9]{1,5}$ ]] ||
             (( 10#$SSH_PORT < 1 || 10#$SSH_PORT > 65535 )); then
            echo '::error::Check the SSH host, user, and port settings.'
            exit 1
          fi
          if [[ ! $DEPLOY_PATH =~ ^/[a-zA-Z0-9._/-]+$ ||
                $DEPLOY_PATH =~ ^/+$ ||
                "$DEPLOY_PATH/" == *'/../'* || "$DEPLOY_PATH/" == *'/./'* ]]; then
            echo '::error::DEPLOY_PATH must be an absolute path to the website directory.'
            exit 1
          fi
          if [[ -n $DEPLOY_PHP && ! $DEPLOY_PHP =~ ^([a-zA-Z0-9][a-zA-Z0-9._-]*|/[a-zA-Z0-9._/-]+)$ ]]; then
            echo '::error::DEPLOY_PHP must be an executable name or an absolute path.'
            exit 1
          fi

          umask 077
          temp=$(mktemp -d)
          trap 'rm -rf -- "$temp"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$temp/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$temp/known_hosts"
          cat > "$temp/ssh_config" <<EOF
          Host relatives-production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile $temp/key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $temp/known_hosts
            ConnectTimeout 15
          EOF

          preflight=$(cat <<'REMOTE'
          if [ -n "$DEPLOY_PHP" ]; then
            exec "$DEPLOY_PHP"
          fi
          for php_bin in php php8.5 php85 php8.4 php84 php8.3 php83 php8.2 php82; do
            if "$php_bin" -r 'exit(PHP_SAPI === "cli" && PHP_VERSION_ID >= 80200 ? 0 : 1);' </dev/null 2>/dev/null; then
              exec "$php_bin"
            fi
          done
          printf '%s\n' 'Deployment could not find PHP CLI 8.2 or newer. Set DEPLOY_PHP to the hosting PHP executable.' >&2
          exit 1
          REMOTE
          )
          tracking_evidence_sql=$(base64 -w0 tracking/migrations/004_tracking_evidence.sql)
          ssh -F "$temp/ssh_config" relatives-production \
            "export RELATIVES_RELEASE_ROOT='${DEPLOY_PATH%/}' DEPLOY_PHP='$DEPLOY_PHP' RELATIVES_TRACKING_EVIDENCE_SQL='$tracking_evidence_sql'; $preflight" \
            < maintenance/release-check.php
          mkdir "$temp/site"
          # Keep the SSH files private and stage web files with their normal read permissions.
          (umask 022; git archive HEAD | tar -x -C "$temp/site")
          cp -a vendor "$temp/site/vendor"
          rsync -rtz --omit-dir-times --delay-updates --protect-args \
            -e "ssh -F $temp/ssh_config" \
            --exclude='/.github/' --exclude='/.git*' \
            --exclude='/docs/' --exclude='/tests/' \
            --exclude='/App Files/.gradle/' --exclude='/App Files/.kotlin/' \
            --exclude='/App Files/local.properties' --exclude='/App Files/**/build/' \
            --exclude='/migrations/' --exclude='/tracking/tests/' --exclude='*.sql' \
            --exclude='/.env' --exclude='/.env.cache.php' \
            --exclude='/config/' --exclude='/help/config.php' \
            --exclude='logs/' --exclude='uploads/' --exclude='saves/' \
            --exclude='/AGENTS.md' --exclude='/REBUILD_RECIPE.md' --exclude='/test_cache.php' \
            "$temp/site/" "relatives-production:${DEPLOY_PATH%/}/"

          # rsync preserves the modes of existing files. Repair the affected public assets.
          ssh -F "$temp/ssh_config" relatives-production "sh -s -- '${DEPLOY_PATH%/}'" <<'REMOTE'
          set -eu
          for asset in manifest.json shared/js/planner-events.js; do
            path="$1/$asset"
            test -f "$path"
            test ! -L "$path"
            chmod a+r "$path"
          done
          REMOTE

          # Archive removed tracked files that would otherwise remain after rsync.
          android_sources='App Files/app/src/main/java/za/co/relatives/app'
          retired=(
            'weather/.htaccess'
            "$android_sources/tracking/OemBatteryHelper.kt"
            "$android_sources/network/TrackingApiClient.kt"
            "$android_sources/ui/tracking/EventsScreen.kt"
            "$android_sources/ui/tracking/GeofencesScreen.kt"
            "$android_sources/ui/tracking/SettingsScreen.kt"
            "$android_sources/ui/tracking/TrackingActivity.kt"
            "$android_sources/ui/tracking/TrackingMapScreen.kt"
            "$android_sources/ui/tracking/TrackingViewModel.kt"
          )
          for obsolete in "${retired[@]}"; do
            [[ ! -e "$temp/site/$obsolete" ]] || continue
            ssh -F "$temp/ssh_config" relatives-production "sh -s -- '${DEPLOY_PATH%/}' '$obsolete'" <<'REMOTE'
          set -eu
          source_file="$1/$2"
          if [ -f "$source_file" ] || [ -L "$source_file" ]; then
            umask 077
            backup_dir=$(mktemp -d "$HOME/.relatives-deploy-backup.XXXXXX")
            mv -- "$source_file" "$backup_dir/"
            printf 'Archived obsolete deployed file %s\n' "$2"
          fi
          REMOTE
          done
      - name: Check deployed Notes and manifest assets
        shell: bash
        run: |
          set -euo pipefail
          version=$(git show -s --format=%ct HEAD)
          for asset in manifest.json "shared/js/planner-events.js?v=$version" "notes/js/notes.js?v=$version"; do
            source_file=${asset%%\?*}
            if ! curl --fail --silent --show-error --compressed --max-time 20 --retry 2 \
              "https://www.relatives.co.za/$asset" | cmp -s "$source_file" -; then
              printf '::error::Could not verify public asset %s\n' "$source_file"
              exit 1
            fi
            printf 'Verified %s\n' "$source_file"
          done
